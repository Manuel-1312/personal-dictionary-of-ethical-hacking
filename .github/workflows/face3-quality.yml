name: Face 3 — Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint "**/*.md" --fix --config .markdownlint.json || true
      - name: Check lint results
        run: |
          if [ -f markdownlint-report.txt ]; then
            cat markdownlint-report.txt
            exit 1
          fi
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install requirements
        run: python -m pip install markdown-it-py requests
      - name: Check for dead markdown links (README + key docs)
        run: |
          python - <<'PY'
from markdown_it import MarkdownIt
import requests
from pathlib import Path

def gather_links(path):
    """Lee un archivo Markdown y extrae todos los enlaces HTTP/HTTPS."""
    text = path.read_text(encoding='utf-8')
    md = MarkdownIt()
    tokens = md.parse(text)
    for token in tokens:
        if token.type == 'inline' and token.children:
            for child in token.children:
                if child.type == 'link_open':
                    for attr, val in child.attrs or []:
                        if attr == 'href':
                            yield val

targets = [Path('README.md'), Path('conceptos/diccionario.md'), Path('CHEAT_SHEETS.md')]
checked = set()
failed = []
for path in targets:
    if not path.exists():
        continue
    for link in gather_links(path):
        if link.startswith('http') and link not in checked:
            checked.add(link)
            try:
                resp = requests.head(link, allow_redirects=True, timeout=10)
                if resp.status_code >= 400:
                    failed.append((str(path), link, resp.status_code))
            except Exception as e:
                failed.append((str(path), link, str(e)))
if failed:
    print('Links with issues:')
    for source, link, err in failed:
        print(f'  [{source}] {link} -> {err}')
    raise SystemExit('Link check failed')
else:
    print(f'All links OK ({len(checked)} checked)')
PY